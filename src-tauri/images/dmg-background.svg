<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f2efe8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4d453c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="url(#paper)"/>
  <circle cx="330" cy="200" r="238" fill="none" stroke="#718775" stroke-opacity=".08" stroke-width="1"/>
  <g transform="translate(52 42)">
    <rect width="38" height="38" rx="10" ry="10" fill="#F7F6F3" filter="url(#shadow)"/>
    <path
      d="M7.125 9.5c11.875 0 11.875 9.5 2.375 9.5s0 9.5 21.375 9.5"
      fill="none"
      stroke="#2E6E8E"
      stroke-width="4.15625"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <text x="51" y="27" fill="#302f2b" font-family="Georgia, serif" font-size="26" font-weight="600">Rill</text>
  </g>
  <text x="330" y="116" text-anchor="middle" fill="#4a4741" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">RillをApplicationsへ</text>
  <text x="330" y="140" text-anchor="middle" fill="#817c73" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">アイコンを右へドラッグしてインストール</text>
  <text x="330" y="354" text-anchor="middle" fill="#9a958c" font-family="Georgia, serif" font-size="11" font-style="italic">Still waters run deep.</text>
</svg>
